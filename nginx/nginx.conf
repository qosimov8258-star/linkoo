server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/161-97-122-204.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/161-97-122-204.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The app also sends HSTS itself; repeating it here covers nginx's own responses.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    # The cert and ALLOWED_ORIGIN only cover the sslip.io hostname, so
    # requests made directly against the bare IP fail CORS in middleware.ts.
    # Redirect them to the canonical hostname instead.
    if ($host != "161-97-122-204.sslip.io") {
        return 301 https://161-97-122-204.sslip.io$request_uri;
    }

    # API bodies are JSON; the app refuses more than 2 MB anyway (middleware.ts).
    location /api/ {
        client_max_body_size 4m;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
